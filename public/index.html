<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Live Cursor Playground</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="board"></canvas>

    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-title">Live Cursor Playground</div>
          <div class="brand-subtitle" id="roomLabel">Room: default</div>
        </div>
      </div>

      <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>

      <div id="controls" class="controls">
        <input id="nameInput" type="text" maxlength="24" placeholder="Your name" />
        <input id="colorInput" type="color" value="#ff7c43" />
        <button id="micBtn" title="Toggle microphone">🎤 Off</button>
        <button id="copyLinkBtn">Copy room link</button>
        <button id="leaveBtn">Leave room</button>
        <button id="clearBtn">Clear board</button>
      </div>
    </div>

    <div id="transcript-panel" class="transcript-panel">
      <div id="transcripts"></div>
    </div>
    </div>

    <div id="presence"></div>

    <details class="debug">
      <summary>Debug</summary>
      <textarea id="logs" readonly></textarea>
    </details>
  </div>

  <script src="/client.js"></script>
</body>
</html>
